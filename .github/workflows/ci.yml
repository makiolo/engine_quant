name: CI

on:
  push:
  pull_request:

jobs:
  rust-tests:
    name: Rust (engine-core, engine-ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # rustup respeta rust/rust-toolchain.toml automáticamente (PLAN.md §7.3).
      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace --locked

      # PLAN.md §7.11 (Fase 5): la feature `gpu` (burn-wgpu) no se ejercita en CI porque
      # este runner no tiene adaptador GPU (eso se hace a mano con `examples/gpu_probe.rs`
      # y `examples/gpu_vs_cpu_bench.rs`), pero sí debe seguir compilando en cada cambio.
      - name: cargo check --features gpu (compila, no requiere GPU)
        working-directory: rust
        run: cargo check -p engine-core --features gpu --locked --examples

  build-and-smoke-test:
    name: Build completo (CMake + Corrosion + cxx + nanobind + gtest) + tests C++ + tests Python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure (CMake + Corrosion + cxx + nanobind)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      # Release por el mismatch de CRT Debug/Release documentado en PLAN.md §7.1.
      - name: Build
        run: cmake --build build

      # Capas 2-3 de §5.6 sobre el registry C++ (PLAN.md §5.4, Fase 2): wiring de
      # Registry<T>/IModel/IProduct/IMeasure, no repite la validación numérica fina que ya
      # cubre `rust-tests`. Incluye los tests de la C ABI (PLAN.md §7.13, cpp/engine/tests/
      # test_abi.cpp), aunque solo llaman a engine/abi.h desde C++ (GoogleTest).
      - name: C++ tests (registry de modelos/productos/medidas + C ABI)
        run: ctest --test-dir build --output-on-failure -C Release

      # PLAN.md §7.13 (Fase 6): a diferencia del paso de arriba, esto compila y ejecuta
      # engine/abi.h desde un compilador de C de verdad (project(... LANGUAGES CXX C) en la
      # raíz) -- la única forma de confirmar que la C ABI es consumible sin C++, no solo que
      # "parece C". Debe imprimir el mismo CVA que test_abi.cpp/test_registry.py/Excel real.
      - name: C ABI smoke test (compilado y ejecutado como C puro)
        run: build/cpp/engine/engine_abi_c_smoke.exe

      - name: Python smoke test (ping + Hull-White/IRS/CVA sobre Burn)
        run: python clients/python/tests/test_smoke.py build/clients/python

      # Fase 3 (PLAN.md §5.4, §7.6): equivalente Python de cpp/engine/tests/test_registry.cpp,
      # confirma que el binding nanobind expone Registries/register_builtins/Registry<T>::create/
      # IMeasure::evaluate con la misma semántica que el registry C++.
      - name: Python registry test (Engine/Model/Product/Measure)
        run: python clients/python/tests/test_registry.py build/clients/python

      # PLAN.md §7.12: set_compute_backend/get_compute_backend/backend() -- este runner
      # compila sin ENGINE_QUANT_ENABLE_GPU (ver paso "Configure" arriba), así que solo
      # ejercita el contrato de la API con CpuBackend; is_gpu_backend_available() debe dar
      # False aquí.
      - name: Python backend-selection test (set_compute_backend/backend())
        run: python clients/python/tests/test_backend.py build/clients/python
