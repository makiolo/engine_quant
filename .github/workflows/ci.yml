name: CI

on:
  push:
  pull_request:

jobs:
  rust-tests:
    name: Rust (engine-core, engine-ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # rustup respeta rust/rust-toolchain.toml automáticamente (PLAN.md §7.3).
      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace --locked

      # PLAN.md §7.11 (Fase 5): la feature `gpu` (burn-wgpu) no se ejercita en CI porque
      # este runner no tiene adaptador GPU (eso se hace a mano con `examples/gpu_probe.rs`
      # y `examples/gpu_vs_cpu_bench.rs`), pero sí debe seguir compilando en cada cambio.
      - name: cargo check --features gpu (compila, no requiere GPU)
        working-directory: rust
        run: cargo check -p engine-core --features gpu --locked --examples

  build-and-smoke-test:
    name: Build completo (CMake + Corrosion + cxx + nanobind + gtest) + tests C++ + tests Python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure (CMake + Corrosion + cxx + nanobind)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      # Release por el mismatch de CRT Debug/Release documentado en PLAN.md §7.1.
      - name: Build
        run: cmake --build build

      # Capas 2-3 de §5.6 sobre el registry C++ (PLAN.md §5.4, Fase 2; engine::price en
      # §7.15): wiring de Registry<T>/IModel/IProduct/IMeasure, no repite la validación
      # numérica fina que ya cubre `rust-tests`. Incluye los tests de la C ABI (PLAN.md §7.13,
      # cpp/engine/tests/test_abi.cpp) y del bridge de Excel (clients/excel/tests, PLAN.md
      # §7.8), aunque ninguno de los dos requiere Excel/C real instalado (GoogleTest).
      - name: C++ tests (registry de modelos/productos/medidas + C ABI + bridge Excel)
        run: ctest --test-dir build --output-on-failure -C Release

      # PLAN.md §7.13 (Fase 6): a diferencia del paso de arriba, esto compila y ejecuta
      # engine/abi.h desde un compilador de C de verdad (project(... LANGUAGES CXX C) en la
      # raíz) -- la única forma de confirmar que la C ABI es consumible sin C++, no solo que
      # "parece C". Ejercita engine_abi_price (PLAN.md §7.15) con invariantes cualitativos
      # (PV~0/DV01>0/PFE95>=EE>=0/CVA>0); el valor exacto de referencia vive en
      # cpp/engine/tests/test_registry.cpp/clients/python/tests/test_price.py.
      - name: C ABI smoke test (compilado y ejecutado como C puro)
        run: build/cpp/engine/engine_abi_c_smoke.exe

      # PLAN.md §7.13 (Fase 6, ejemplos multi-lenguaje): C++ idiomático (RAII + excepciones)
      # sobre la misma engine/abi.h, ver examples/abi/README.md.
      - name: C++ ABI example (RAII + excepciones sobre engine/abi.h)
        run: build/cpp/engine/engine_abi_cpp_example.exe

      # examples/abi/rust: crate independiente (no es miembro de rust/Cargo.toml), FFI manual
      # a engine_abi -- demuestra que incluso Rust podría consumir el motor como un lenguaje
      # externo cualquiera. El .dll debe copiarse junto al .exe para que Windows lo encuentre
      # en tiempo de ejecución (el .lib de import ya basta para enlazar, ver build.rs).
      #
      # Deliberadamente SIN `shell: bash`: Git Bash antepone su propio `/usr/bin` (coreutils,
      # que incluye un `link.exe` homónimo) al directorio del linker de MSVC en el PATH, así
      # que `cargo build` con el toolchain MSVC invoca ese `link.exe` equivocado en vez del de
      # Visual Studio -- el fallo se ve como un error de "operando" de coreutils `link`, no
      # como un error de enlazado real. El shell por defecto en runners Windows (pwsh) no
      # tiene ese problema.
      - name: Rust ABI example (FFI manual a engine_abi, fuera del workspace de Cargo)
        working-directory: examples/abi/rust
        run: |
          cargo build
          Copy-Item ../../../build/cpp/engine/engine_abi.dll target/debug/
          ./target/debug/engine_abi_example.exe

      # examples/abi/python: ctypes (solo librería estándar), no el .pyd de nanobind de
      # clients/python -- la demostración más directa de qué significa "universal" en §5.5.
      - name: Python ABI example (ctypes, sin nanobind)
        run: python examples/abi/python/abi_example_ctypes.py

      # Misma ABI, vía cffi (ffi.dlopen) en vez de ctypes -- ver examples/abi/README.md para
      # la comparación entre ambas. Único ejemplo con una dependencia externa a instalar.
      - name: Python ABI example (cffi)
        run: |
          pip install cffi
          python examples/abi/python/abi_example_cffi.py

      - name: Python smoke test (ping + Hull-White/IRS/CVA sobre Burn)
        run: python clients/python/tests/test_smoke.py build/clients/python

      # Fase 3 (PLAN.md §5.4, §7.6): equivalente Python de cpp/engine/tests/test_registry.cpp,
      # confirma que el binding nanobind expone Registries/register_builtins/Registry<T>::create/
      # engine::price con la misma semántica que el registry C++.
      - name: Python registry test (Engine/Model/Product)
        run: python clients/python/tests/test_registry.py build/clients/python

      # PLAN.md §7.15: Engine.price/MarketSnapshot/PricingContext/ExecutionContext -- este
      # runner compila sin ENGINE_QUANT_ENABLE_GPU (ver paso "Configure" arriba), así que
      # ExecutionContext({"backend": "auto"}) siempre resuelve a "cpu" aquí. Incluye el valor
      # de referencia exacto (UnilateralCVA=503.64194077997536, mismo EE/PFE95 que
      # cpp/engine/tests/test_registry.cpp).
      - name: Python price test (ENGINE.PRICE -- PV/DV01/ExpectedExposure/PFE95/UnilateralCVA)
        run: python clients/python/tests/test_price.py build/clients/python

      # PLAN.md §7.14 (Fase 7): equivalente Python de cpp/engine/tests/test_calibration.cpp,
      # incluido el round-trip MarketSnapshot -> calibrate -> Engine.create_model.
      - name: Python calibration test (MarketSnapshot/Calibrator)
        run: python clients/python/tests/test_calibration.py build/clients/python

      # PLAN_REAPI.md §6 Fase 1: engine_typed es un paquete Python puro (no pasa por CMake),
      # así que solo necesita su dependencia (pydantic) instalada -- no un rebuild.
      - name: Install engine_typed runtime dependency (pydantic)
        run: pip install "pydantic>=2"

      - name: Python engine_typed test (TradeSpec/IRSwap tipados)
        run: python clients/python/tests/test_engine_typed_trade.py build/clients/python

      - name: Python engine_typed test (Model/Market/PricingContext/ExecutionContext tipados)
        run: python clients/python/tests/test_engine_typed_context.py build/clients/python

      # PLAN_REAPI.md §6 Fase 3: MeasureSpec en price.hpp -- tuplas (nombre, params) desde
      # Python, DV01(bump=...) con efecto real, price() resolviendo nombres directos del
      # registry (p.ej. "ExposureProfile").
      - name: Python price test (MeasureSpec -- DV01 bump configurable, tuplas (nombre, params))
        run: python clients/python/tests/test_price_measure_spec.py build/clients/python

      - name: Python engine_typed test (Measure tipadas -- PV/DV01/ExposureProfile/UnilateralCVA)
        run: python clients/python/tests/test_engine_typed_measure.py build/clients/python

      # PLAN_REAPI.md §6 Fase 4: PV/DV01 descuentan por la curva de MarketSnapshot (ya no por
      # el modelo) -- sanity check sobre una curva multi-pillar NO plana.
      - name: Python price test (PV/DV01 por curva de mercado, curva no plana)
        run: python clients/python/tests/test_price_market_discounting.py build/clients/python

      # PLAN_PRODUCTS.md SS12 Fase 3 (adelanta engine_typed.payoff de Fase 10): AST tipado
      # (Pydantic discriminado) -> Engine.create_product("Payoff", {"spec": json}) real.
      - name: Python engine_typed test (payoff.PayoffProduct -- AST tipado -> Engine.create_product)
        run: python clients/python/tests/test_engine_typed_payoff.py build/clients/python

      # PLAN_PRODUCTS.md SS12 Fase 0 (ADR-P0-09): schema estatico + ejemplos, sin motor
      # compilado -- por eso no recibe build/clients/python como los tests de arriba.
      - name: Python payoff schema test (engine.payoff/v1 + ejemplos)
        run: |
          pip install jsonschema
          python clients/python/tests/test_payoff_schema.py
