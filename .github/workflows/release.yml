name: Release

# Empaqueta y publica los artefactos de una release (PLAN.md §7.9): ruedas de Python
# autocontenidas (una por version de CPython) y el .xll de Excel con sus dependencias y el
# instalador. Dos formas de disparar una publicacion real (job publish-release):
#   1. Empujar un tag "vX.Y.Z" (`git tag v0.1.0 && git push origin v0.1.0`).
#   2. Lanzarlo a mano (pestaña Actions > Release > Run workflow) con "publish" marcado y
#      "version" relleno -- softprops/action-gh-release crea el tag "vX.Y.Z" y la release en
#      el mismo paso, sin necesitar tocar git en local.
# Un `workflow_dispatch` sin "publish" marcado compila las wheels Windows + .xll y los deja
# como artefactos del workflow (pestaña Summary del run), sin crear ninguna release ni tag:
# sirve para probar el pipeline de build antes de publicar de verdad. Las wheels manylinux se
# generan solamente cuando hay una release real (`publish == true`), porque son las destinadas
# al conjunto de artefactos multiplataforma de PyPI.
# Publicar en PyPI (job publish-pypi, PLAN_API_REFACTOR.md Fase 10) es un paso aparte,
# desactivado por defecto: requiere ademas marcar a mano el input `publish_pypi` (booleano,
# default false, independiente de "publish") en un `workflow_dispatch` -- un tag "vX.Y.Z" o un
# `workflow_dispatch` con "publish_pypi" sin marcar siguen produciendo solo la Release de
# GitHub, exactamente como hoy. Con "publish_pypi" marcado (y el secret PYPI_API_TOKEN ya
# configurado) se publica ademas el paquete `quantdesk` en PyPI con esa misma version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar una release en GitHub al terminar (si no, solo se compilan y suben los artefactos del workflow)"
        type: boolean
        default: false
      version:
        description: "Version a publicar, p.ej. 0.1.0 (obligatorio si 'publish' esta marcado; se ignora en un disparo por tag)"
        type: string
        default: ""
      publish_pypi:
        description: "Ademas de la Release de GitHub, publicar el paquete quantdesk en PyPI (requiere el secret PYPI_API_TOKEN ya configurado; independiente de 'publish', propio de un workflow_dispatch -- un disparo por tag nunca lo activa)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  determine-version:
    name: Determinar version y si se publica
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      publish: ${{ steps.compute.outputs.publish }}
    steps:
      - name: Calcular version/tag/publish
        id: compute
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag_name="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$INPUT_PUBLISH" == "true" ]]; then
            version="$INPUT_VERSION"
            # La UI de workflow_dispatch permite espacios accidentales al principio/final.
            # Sin recortarlos, ISCC recibe `/DMyAppVersion=` y la version como dos argumentos.
            version="${version#"${version%%[![:space:]]*}"}"
            version="${version%"${version##*[![:space:]]}"}"
            if [[ -z "$version" ]]; then
              echo "::error::Con 'publish' marcado hace falta indicar 'version' (p.ej. 0.1.0)"
              exit 1
            fi
            tag_name="v$version"
            publish=true
          else
            version="0.0.0.dev0+${GITHUB_SHA::8}"
            tag_name=""
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2}[A-Za-z0-9.+_-]*$ ]]; then
            echo "::error::Version no valida: '$version'. Usa un valor como 0.13.0 o 0.13.0rc1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version: $version | tag: $tag_name | publish: $publish"

  quality-gate:
    name: Tests Rust + SDK REST + Clippy
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fijar version en Rust
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: printf '%s' "$RELEASE_VERSION" > rust/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Tests de todo el workspace Rust
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Clippy de todos los crates y targets propios
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --no-deps --locked -- -D warnings

      # Las features GPU se compilan para detectar regresiones, pero no se ejecutan tests GPU:
      # los runners alojados de GitHub no garantizan un adaptador compatible.
      - name: Compilar todos los targets y features (GPU sin ejecutar)
        working-directory: rust
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      - name: Tests del SDK REST y contratos de fixtures
        env:
          PYTHONPATH: clients/python/src
        run: python -m pytest clients/python/tests/test_quantrest.py benches/test_fixtures.py -q

  build-wheels:
    name: Wheel Python (cp${{ matrix.python-version }}, win_amd64)
    needs: [determine-version, quality-gate]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Fijar version en Rust
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: printf '%s' "$RELEASE_VERSION" > rust/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # pyproject.toml versiona "0.0.0" en el repo (solo para builds locales/de desarrollo);
      # aqui se sobrescribe con la version calculada por determine-version.
      - name: Fijar la version del paquete
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          sed -i "s/^version = \"0.0.0\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
          echo "Version fijada: $RELEASE_VERSION"

      - name: Instalar herramientas de build
        run: python -m pip install --upgrade pip delvewheel

      # scikit-build-core (pyproject.toml) construye solo engine_py_ext (PLAN.md §7.9):
      # ENGINE_QUANT_BUILD_TESTS/ENGINE_QUANT_BUILD_EXCEL=OFF ya vienen fijados ahi, no aqui.
      # `pip wheel` (no `python -m build`) igual que en la verificacion local del pipeline:
      # ambos son frontends PEP517 equivalentes, se prefiere el que quedo probado end-to-end.
      - name: Construir la wheel
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: -DENGINE_QUANT_VERSION=${{ needs.determine-version.outputs.version }}
        run: python -m pip wheel . -w wheelhouse --no-deps

      # La wheel enlaza dinamicamente MSVCP140.dll (runtime de C++); delvewheel lo detecta y
      # lo embebe (mangling de nombre incluido) para que `pip install` no dependa de tener el
      # redistribuible de Visual C++ ya instalado (vcruntime140[_1].dll se consideran parte
      # del CRT universal que trae Windows 10/11 actualizado, delvewheel no los copia).
      - name: Reparar la wheel (autocontenida)
        shell: bash
        run: python -m delvewheel repair -w dist wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win-cp${{ matrix.python-version }}
          path: dist/*.whl

  build-manylinux-wheels:
    name: Wheels Python (manylinux_2_28_x86_64, cp310-cp314)
    needs: [determine-version, quality-gate]
    # Las wheels Linux se preparan para publicar; no se construyen en los workflow_dispatch
    # de prueba que no crean una release.
    if: needs.determine-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fijar version en Rust
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: printf '%s' "$RELEASE_VERSION" > rust/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fijar la version del paquete
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          sed -i "s/^version = \"0.0.0\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
          echo "Version fijada: $RELEASE_VERSION"

      # cibuildwheel construye dentro de la imagen manylinux y auditwheel repara el ELF
      # resultante. Se seleccionan tags explicitos para no incluir cp314t (free-threaded),
      # que no forma parte aun de la matriz publicada por este proyecto.
      - name: Construir wheels manylinux
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_CONFIG_SETTINGS_LINUX: cmake.define.ENGINE_QUANT_VERSION=${{ needs.determine-version.outputs.version }}
          # El toolchain del proyecto esta fijado en rust/rust-toolchain.toml; se instala
          # dentro del contenedor porque el runner Ubuntu no comparte su cargo con manylinux.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.97.1
          CIBW_ENVIRONMENT_LINUX: PATH=/root/.cargo/bin:$PATH
          CIBW_OUTPUT_DIR: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publicar quantdesk en PyPI
    needs: [determine-version, build-wheels, build-manylinux-wheels]
    if: needs.determine-version.outputs.publish == 'true' && inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    # environment "pypi": permite exigir aprobacion manual en GitHub antes de este job, dado
    # que PyPI no deja volver a subir la misma version si algo sale mal (a diferencia de la
    # Release de GitHub, que se puede editar/borrar -- ver PLAN_API_REFACTOR.md §6).
    environment: pypi
    permissions:
      id-token: write
    steps:
      # merge-multiple junta las N wheels (una por version de CPython, artefactos
      # wheel-win-cp3.10/wheel-manylinux/...) en un unico directorio.
      - name: Descargar las wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # Camino inicial (PLAN_API_REFACTOR.md Fase 10): token clasico en el secret
      # PYPI_API_TOKEN, creado a mano la primera vez que se registra el proyecto `quantdesk`
      # en pypi.org. Migrar a Trusted Publishing (OIDC, sin secret almacenado) es un cambio de
      # configuracion posterior sobre este mismo job (basta con quitar `password` y registrar
      # el trusted publisher en pypi.org apuntando a este repositorio/workflow/environment), no
      # implementado todavia. Si PYPI_API_TOKEN no esta configurado, este paso falla con el
      # mensaje de error propio de la action -- aceptable porque `publish_pypi` nace en false
      # por defecto, este job solo corre cuando alguien lo pide explicitamente.
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-xll:
    name: Complemento de Excel (.xll + instalador)
    needs: [determine-version, quality-gate]
    runs-on: windows-latest
    env:
      ASSET_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Fijar version en Rust
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: printf '%s' "$RELEASE_VERSION" > rust/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure (CMake + Corrosion + cxx + nanobind)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_QUANT_VERSION="$RELEASE_VERSION" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build
        run: cmake --build build

      # Incluye engine_excel_harness_test (PLAN.md §7.8): carga el .xll YA COMPILADO que se
      # va a empaquetar mas abajo y ejerce xlAutoOpen/las UDFs como lo haria Excel de verdad.
      - name: Tests (registry + bridge Excel + harness del .xll)
        run: ctest --test-dir build --output-on-failure -C Release

      # engine_excel.xll enlaza Rust estaticamente (PLAN.md §5.4); la unica dependencia
      # dinamica que no forma parte de Windows es MSVCP140.dll (mismo criterio que la wheel
      # de Python, ver el job build-wheels/delvewheel): se copia junto al .xll para que quien
      # lo instale no necesite Visual Studio ni el redistribuible de VC++ por separado
      # (Windows busca primero en la carpeta del propio modulo cargado por ruta completa).
      - name: Empaquetar el complemento (.xll + DLL + instalador)
        shell: pwsh
        run: |
          $stage = "package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/clients/excel/engine_excel.xll $stage

          # No se asume el nombre de carpeta "Microsoft.VC143.CRT" (cambia de version en
          # version del toolset, p.ej. VS2022 14.44 vs una posterior 14.51 con otra carpeta):
          # se busca msvcp140.dll dentro de VCToolsRedistDir y, si no aparece ahi, dentro del
          # propio compilador (VCToolsInstallDir) -- misma copia funcional que usa delvewheel
          # cuando no encuentra la de Redist (ver el job build-wheels).
          $msvcp140 = $null
          if ($env:VCToolsRedistDir) {
              $msvcp140 = Get-ChildItem -Path $env:VCToolsRedistDir -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like '*\x64\*' -and $_.FullName -notlike '*\onecore\*' -and $_.FullName -notlike '*\debug_nonredist\*' } |
                  Select-Object -First 1
          }
          if (-not $msvcp140 -and $env:VCToolsInstallDir) {
              $msvcp140 = Get-ChildItem -Path $env:VCToolsInstallDir -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like '*\Hostx64\x64\*' } |
                  Select-Object -First 1
          }
          if (-not $msvcp140) {
              throw "No se encontro msvcp140.dll ni en VCToolsRedistDir ('$env:VCToolsRedistDir') ni en VCToolsInstallDir ('$env:VCToolsInstallDir')"
          }
          Write-Host "Usando msvcp140.dll: $($msvcp140.FullName)"
          Copy-Item $msvcp140.FullName $stage

          Copy-Item clients/excel/install/Install-EngineExcelAddin.ps1 $stage
          Copy-Item clients/excel/install/Uninstall-EngineExcelAddin.ps1 $stage
          Copy-Item clients/excel/install/README.md $stage
          $zipName = "engine_excel-$env:ASSET_VERSION-win_amd64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: engine_excel-xll
          path: ${{ env.ZIP_NAME }}

  build-installer:
    name: Instalador Windows (.exe, wizard)
    needs: [determine-version, build-wheels, build-xll]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # El servidor/binario quant-api REST queda deliberadamente fuera del instalador en esta
      # fase. El payload sigue siendo únicamente wheels Python (incluido el SDK cliente) + XLL.

      # merge-multiple junta las N wheels Windows (una por version de CPython, artefactos
      # wheel-win-cp3.10/wheel-win-cp3.11/...) en un unico directorio -- Install-EngineWheels.ps1
      # (PLAN.md §7.9) elige la que corresponda a cada interprete detectado en tiempo de
      # instalacion, no hace falta seleccionar ninguna aqui.
      - name: Descargar las wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-win-cp*
          path: installer/payload/wheels
          merge-multiple: true

      - name: Descargar el paquete del XLL
        uses: actions/download-artifact@v4
        with:
          name: engine_excel-xll
          path: installer/payload/xll-zip

      - name: Descomprimir el paquete del XLL
        shell: pwsh
        run: |
          $zip = Get-ChildItem installer/payload/xll-zip -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath installer/payload/xll -Force
          Remove-Item installer/payload/xll-zip -Recurse -Force

      - name: Copiar los scripts de instalacion de Python
        shell: bash
        run: cp clients/python/install/*.ps1 installer/payload/wheels/

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # AppId fijo en EngineQuantSetup.iss: instalar una version nueva sobre una anterior
      # actualiza en el mismo sitio (Programas y caracteristicas no duplica la entrada) y
      # [InstallDelete] limpia {app}\wheels/{app}\xll antes de copiar los ficheros nuevos, asi
      # que una wheel/xll de una version anterior no se queda a medias junto a la nueva.
      - name: Compilar el instalador
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:INSTALLER_VERSION" "installer\EngineQuantSetup.iss"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        with:
          name: engine_quant-installer
          path: dist_installer/*.exe

  publish-release:
    name: Publicar la release en GitHub
    needs: [determine-version, build-wheels, build-manylinux-wheels, build-xll, build-installer]
    if: needs.determine-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aplanar los artefactos descargados
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.whl" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release_assets/ \;
          ls -la release_assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
