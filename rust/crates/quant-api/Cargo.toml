[package]
name = "quant-api"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
quant-domain = { path = "../quant-domain" }
quant-engine = { path = "../quant-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
