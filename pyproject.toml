[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "engine-quant"
# Sobrescrita por el workflow de release (.github/workflows/release.yml) a partir del tag
# de la release; "0.0.0" es solo el valor para builds locales/de desarrollo.
version = "0.0.0"
description = "Motor de calculo XVA (CVA/DVA/FVA/MVA/KVA): cliente Python (import engine) sobre el registry C++/Rust del motor."
readme = "clients/python/README_PYPI.md"
requires-python = ">=3.9"
# `pydantic` es dependencia obligatoria desde PLAN_REAPI.md §6 Fase 1 (engine_typed): renuncia
# deliberada a la promesa anterior "sin dependencias Python en tiempo de ejecución"
# (README_PYPI.md) a cambio de la fachada tipada q.IRSwap/q.HullWhite1F/... -- la extensión
# nativa `engine` en sí sigue sin dependencias.
dependencies = ["pydantic>=2"]

[tool.scikit-build]
# El CMakeLists.txt raiz orquesta Rust (Corrosion) + C++ (registry) + Python (nanobind) +
# tests + Excel/XLL (PLAN.md §7). Para un build de wheel solo hace falta compilar/instalar
# el target `engine_py_ext` (clients/python/CMakeLists.txt): ENGINE_QUANT_BUILD_TESTS/
# ENGINE_QUANT_BUILD_EXCEL=OFF evitan traerse GoogleTest y compilar el XLL sin necesidad.
build.targets = ["engine_py_ext"]
build.verbose = true
cmake.build-type = "Release"
cmake.define = { ENGINE_QUANT_BUILD_TESTS = "OFF", ENGINE_QUANT_BUILD_EXCEL = "OFF" }
# El unico artefacto instalado por CMake es engine.pyd (nanobind, OUTPUT_NAME "engine") vía el
# install(TARGETS engine_py_ext ...) de clients/python/CMakeLists.txt. `engine_typed`
# (PLAN_REAPI.md §6 Fase 1) es un paquete Python puro aditivo -- no pasa por CMake, se
# autocopia desde clients/python/src/engine_typed al layout de la wheel.
wheel.packages = ["clients/python/src/engine_typed"]
wheel.install-dir = "."
